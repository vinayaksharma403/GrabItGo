<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Shopping Bag / Fast Delivery Basket Motif -->
  <!-- Handle -->
  <path d="M24 23 C24 16, 40 16, 40 23" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

  <!-- Bag Body -->
  <path d="M17 23 L47 23 C48.5 23 49.5 24.5 49 26 L44.5 49 C44 51.5 42 53 39.5 53 L24.5 53 C22 53 20 51.5 19.5 49 L15 26 C14.5 24.5 15.5 23 17 23 Z" fill="#FFFFFF" filter="url(#dropShadow)" />

  <!-- Lightning / Fast Bolt (Amber Accent) -->
  <path d="M34 26 L27 37 L32 37 L29 48 L39 36 L34 36 Z" fill="url(#accentGrad)" stroke="#B45309" stroke-width="0.75" stroke-linejoin="round" />
</svg>
