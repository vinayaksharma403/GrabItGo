<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="placeholderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="brandAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#placeholderBg)" />
  <rect x="2" y="2" width="396" height="396" rx="20" fill="none" stroke="#E2E8F0" stroke-width="2" />

  <!-- Inner Subtle Dash Border -->
  <rect x="24" y="24" width="352" height="352" rx="16" fill="#FFFFFF" fill-opacity="0.6" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Package / Box Illustration -->
  <g fill="none" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="translate(140, 110)">
    <!-- Box Top Face -->
    <polygon points="60,10 110,35 60,60 10,35" fill="#F8FAFC" stroke="#94A3B8" />
    <!-- Box Left Face -->
    <polygon points="10,35 10,95 60,120 60,60" fill="#EDF2F7" stroke="#94A3B8" />
    <!-- Box Right Face -->
    <polygon points="60,60 60,120 110,95 110,35" fill="#E2E8F0" stroke="#94A3B8" />
    <!-- Seam Center Line -->
    <line x1="60" y1="60" x2="60" y2="120" stroke="#94A3B8" />
    <!-- Flap Tape Indicator with Emerald Accent -->
    <path d="M35 22.5 L85 47.5" stroke="url(#brandAccent)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Status / Brand Labels -->
  <text x="200" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.2">
    No Image Available
  </text>
  <text x="200" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">
    GrabItGo Essentials
  </text>
</svg>
